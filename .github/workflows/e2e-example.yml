name: E2E (example)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/example/**"
      - "packages/shared-components/**"
      - "lib/**"
      - "priv/repo/**"
      - "config/**"
      - ".github/workflows/e2e-example.yml"

permissions:
  contents: read

concurrency:
  group: e2e-example-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir and Erlang/OTP
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-dev-${{ runner.os }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install and compile the API
        run: |
          mix deps.get --check-locked
          mix compile

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Enable Yarn through Corepack
        run: |
          npm install --global corepack
          corepack enable

      - name: Install dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: yarn install --immutable

      - name: Build shared-components
        run: yarn shared:build

      - name: Browser tests
        env:
          E2E_START_STACK: "1"
        run: yarn example:e2e
