nodeLinker: node-modules

# typescript is the @typescript/typescript6 wrapper; Yarn's PnP patch for it fails harmlessly.
logFilters:
  - pattern: "typescript@patch:@typescript/typescript6@*"
    level: discard

# Astro tooling relies on hoisting for these undeclared peer dependencies.
packageExtensions:
  "@astrojs/language-server@*":
    peerDependencies:
      typescript: "*"
  "@astrojs/react@*":
    peerDependencies:
      vite: "*"
  "@astrojs/react-renderer@*":
    peerDependencies:
      vite: "*"
