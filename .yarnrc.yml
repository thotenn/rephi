nodeLinker: node-modules

# TypeScript 6 is installed under the `typescript` name through the
# `@typescript/typescript6` wrapper (see the package.json files). Yarn's built-in
# Plug'n'Play patch for `typescript` cannot be applied to that wrapper and is not
# needed with the node-modules linker, so its optional failure is not reported.
logFilters:
  - pattern: "typescript@patch:@typescript/typescript6@*"
    level: discard
